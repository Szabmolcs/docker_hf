<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Számológép</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h2>Számológép </h2>

    <input type="number" id="a" placeholder="Első szám" step="any">

    <select id="op">
      <option value="+">+</option>
      <option value="-">−</option>
      <option value="*">×</option>
      <option value="/">÷</option>
    </select>

    <input type="number" id="b" placeholder="Második szám" step="any">

    <button id="calc">Számol</button>

    <p id="result"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
